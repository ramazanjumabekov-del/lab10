name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        id: project
        run: |
          file=$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)
          echo "dir=$(dirname "$file")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm ci

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Find build output
        id: out
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f docs/index.html ]; then echo "path=docs" >> "$GITHUB_OUTPUT"; else echo "path=dist" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.dir }}/${{ steps.out.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
